      - name: Generate README
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Strip readme-aura branding
        run: |
          sed -i 's/ "Generated by readme-aura"//g' README.md
          sed -i '/powered by.*readme-aura/d' README.md
          sed -i '/<br>$/d' README.md